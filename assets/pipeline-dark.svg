<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="How I work: discovery, execution, delivery">
<style>
  .sans{font-family:'Inter','Helvetica Neue',Helvetica,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .meta{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:10px;letter-spacing:3.4px;fill:#6E7A87}
  .rule{stroke:#30363D;stroke-width:1}
  .ac{fill:#D4FF4F}
  text{text-rendering:geometricPrecision}

  .idx{font-family:'Inter','Helvetica Neue',Helvetica,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:34px;font-weight:800;letter-spacing:-1px;
       fill:none;stroke:#E6EDF3;stroke-width:1.1;opacity:.55}
  .st{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11px;letter-spacing:3px;fill:#D4FF4F}
  .qt{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;fill:#9BA6B2}
  .qt b{fill:#E6EDF3;font-weight:600}
.em{font-weight:600;fill:#E6EDF3}
</style>
<text class="idx" x="44" y="46">01</text>
<text class="st" x="44" y="74">DISCOVERY</text>
<line class="rule" x1="44" y1="88" x2="292" y2="88"/>
<rect x="44" y="86.5" width="34" height="3" fill="#D4FF4F"/>
<text class="qt" x="44" y="114">If users aren't complaining,</text>
<text class="qt" x="44" y="133"><tspan class="em">I'm not building.</tspan></text>
<text class="qt" x="44" y="152">80+ interviews before the</text>
<text class="qt" x="44" y="171">first line of spec.</text>
<path d="M302 42 l6 5 -6 5" fill="none" stroke="#6E7A87" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="idx" x="316" y="46">02</text>
<text class="st" x="316" y="74">EXECUTION</text>
<line class="rule" x1="316" y1="88" x2="564" y2="88"/>
<rect x="316" y="86.5" width="34" height="3" fill="#D4FF4F"/>
<text class="qt" x="316" y="114">Specs are cheap, untested</text>
<text class="qt" x="316" y="133">specs are risky. I prototype</text>
<text class="qt" x="316" y="152">in <tspan class="em">Python / Next.js</tspan> to</text>
<text class="qt" x="316" y="171">de-risk before handoff.</text>
<path d="M574 42 l6 5 -6 5" fill="none" stroke="#6E7A87" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="idx" x="588" y="46">03</text>
<text class="st" x="588" y="74">DELIVERY</text>
<line class="rule" x1="588" y1="88" x2="836" y2="88"/>
<rect x="588" y="86.5" width="34" height="3" fill="#D4FF4F"/>
<text class="qt" x="588" y="114"><tspan class="em">AI is a feature,</tspan> not a</text>
<text class="qt" x="588" y="133">benefit. Users should</text>
<text class="qt" x="588" y="152">forget the AI is there at</text>
<text class="qt" x="588" y="171">all. Ship, measure, iterate.</text>
</svg>
